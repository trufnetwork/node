---
name: Publish Node Image

'on':
  workflow_dispatch:
    inputs:
      tag_latest:
        description: "Also tag this build as latest"
        type: boolean
        default: false
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/node

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    env:
      TAG_LATEST: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag_latest) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A release whose page does not open with the upgrade line gets no image,
      # and latest does not move (docs/release-process.md). A manual run has no
      # release page, so it skips the check.
      - name: Check the upgrade line
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: printf '%s' "$RELEASE_BODY" | scripts/release/check-upgrade-line.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ env.TAG_LATEST }}
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Read the commit time
        id: commit
        run: echo "time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      # Build and load the image first, so a binary that reports the wrong version is never
      # pushed. The push step below reuses this build's cache.
      - name: Build image for the version check (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/Dockerfile
          load: true
          platforms: linux/amd64
          tags: tn-node:version-check
          build-args: |
            TN_VERSION=${{ steps.meta.outputs.version }}
            TN_COMMIT=${{ github.sha }}
            TN_BUILD_TIME=${{ steps.commit.outputs.time }}
          cache-from: type=gha

      - name: Check that kwild reports the image version
        env:
          EXPECTED: ${{ steps.meta.outputs.version }}
        run: |
          got=$(docker run --rm --entrypoint /app/kwild tn-node:version-check version --output json | jq -r '.result.version')
          if [ "$got" != "$EXPECTED" ]; then
            echo "::error::kwild version prints '$got', but the image version is '$EXPECTED'"
            exit 1
          fi
          echo "kwild reports $EXPECTED"

      - name: Build and push image (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployments/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TN_VERSION=${{ steps.meta.outputs.version }}
            TN_COMMIT=${{ github.sha }}
            TN_BUILD_TIME=${{ steps.commit.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image pushed: ${{ env.IMAGE_NAME }}"
          echo "Ref: ${{ github.ref }}"
          echo "Tags:\n${{ steps.meta.outputs.tags }}"
