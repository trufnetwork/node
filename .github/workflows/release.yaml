name: Release

'on':
  workflow_dispatch:
  release:
    types: [published, edited]

# Add permissions for the GITHUB_TOKEN
permissions:
  contents: write
  packages: read
  # This is required for creating and modifying releases
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # A release whose page does not open with the upgrade line gets no binaries
      # (docs/release-process.md). Editing the page to add the line runs this
      # workflow again. A manual run has no release page, so it skips the check.
      - name: Check the upgrade line
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: printf '%s' "$RELEASE_BODY" | scripts/release/check-upgrade-line.sh

      # The last step announces the release in Telegram only when the release
      # had no assets before this run: on its publish, or on the edit that
      # fixes a release whose first run failed, but not on later edits. This
      # reads the release from the API, not from the event, so a run that
      # waited behind an earlier one sees the binaries that run uploaded. A
      # failed read leaves assets unset, so nothing is announced.
      - name: Count the release's assets
        id: before
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          if count=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq length); then
            echo "The release has $count asset(s)."
            echo "assets=$count" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not read the release's assets, so this run does not announce the release in Telegram."
          fi

      - name: Set Version
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # stamp the release, its commit and the commit time into kwild, as task build does
          PKG=github.com/trufnetwork/node/cmd/version
          BUILD_TIME=$(git log -1 --format=%cI)
          echo "LDFLAGS=-X $PKG.TNVersion=$VERSION -X $PKG.TNCommit=$GITHUB_SHA -X $PKG.TNBuildTime=$BUILD_TIME" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build for Darwin AMD64
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o ./.build/kwild ./cmd/kwild/main.go
          tar -czvf ./.build/tn_${{ env.VERSION }}_darwin_amd64.tar.gz -C ./.build kwild
          rm -rf ./.build/kwild

      - name: Build for Darwin ARM64
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o ./.build/kwild ./cmd/kwild/main.go
          tar -czvf ./.build/tn_${{ env.VERSION }}_darwin_arm64.tar.gz -C ./.build kwild
          rm -rf ./.build/kwild

      - name: Build for Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o ./.build/kwild ./cmd/kwild/main.go

      # The runner can run only this binary; the other three take the same LDFLAGS.
      - name: Check that kwild reports the release version
        run: |
          got=$(./.build/kwild version --output json | jq -r '.result.version')
          if [ "$got" != "$VERSION" ]; then
            echo "::error::kwild version prints '$got', but the release is '$VERSION'"
            exit 1
          fi
          got=$(./.build/kwild --version)
          if [ "$got" != "kwild version $VERSION" ]; then
            echo "::error::kwild --version prints '$got', but the release is '$VERSION'"
            exit 1
          fi
          echo "kwild reports $VERSION"

      - name: Package Linux AMD64
        run: |
          tar -czvf ./.build/tn_${{ env.VERSION }}_linux_amd64.tar.gz -C ./.build kwild
          rm -rf ./.build/kwild

      - name: Build for Linux ARM64
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o ./.build/kwild ./cmd/kwild/main.go
          tar -czvf ./.build/tn_${{ env.VERSION }}_linux_arm64.tar.gz -C ./.build kwild
          rm -rf ./.build/kwild

      - name: Release
        id: upload
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./.build/tn_${{ env.VERSION }}_darwin_amd64.tar.gz
            ./.build/tn_${{ env.VERSION }}_darwin_arm64.tar.gz
            ./.build/tn_${{ env.VERSION }}_linux_amd64.tar.gz
            ./.build/tn_${{ env.VERSION }}_linux_arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

      # One message to the Telegram chat and topic that the node alerts use
      # (docs/release-process.md). Without the secrets, as in a fork, the
      # script skips with a notice. A failure here does not fail the release.
      - name: Announce the release in Telegram
        if: github.event_name == 'release' && steps.before.outputs.assets == '0' && steps.upload.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if ! scripts/release/announce-telegram.sh "$RELEASE_TAG" "$RELEASE_URL" <<<"$RELEASE_BODY"; then
            echo "::warning::The release was not announced in Telegram. To post it by hand, see docs/release-process.md#the-telegram-announcement."
            exit 1
          fi
