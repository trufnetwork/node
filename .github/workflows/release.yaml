name: Release

'on':
  workflow_dispatch:
  release:
    types: [published, edited]

# Add permissions for the GITHUB_TOKEN
permissions:
  contents: write
  packages: read
  # This is required for creating and modifying releases
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Version
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # stamp the release, its commit and the commit time into kwild, as task build does
          PKG=github.com/trufnetwork/node/cmd/version
          BUILD_TIME=$(git log -1 --format=%cI)
          echo "LDFLAGS=-X $PKG.TNVersion=$VERSION -X $PKG.TNCommit=$GITHUB_SHA -X $PKG.TNBuildTime=$BUILD_TIME" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build for Darwin AMD64
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o ./.build/kwild ./cmd/kwild/main.go
          tar -czvf ./.build/tn_${{ env.VERSION }}_darwin_amd64.tar.gz -C ./.build kwild
          rm -rf ./.build/kwild

      - name: Build for Darwin ARM64
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o ./.build/kwild ./cmd/kwild/main.go
          tar -czvf ./.build/tn_${{ env.VERSION }}_darwin_arm64.tar.gz -C ./.build kwild
          rm -rf ./.build/kwild

      - name: Build for Linux AMD64
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o ./.build/kwild ./cmd/kwild/main.go

      # The runner can run only this binary; the other three take the same LDFLAGS.
      - name: Check that kwild reports the release version
        run: |
          got=$(./.build/kwild version --output json | jq -r '.result.version')
          if [ "$got" != "$VERSION" ]; then
            echo "::error::kwild version prints '$got', but the release is '$VERSION'"
            exit 1
          fi
          got=$(./.build/kwild --version)
          if [ "$got" != "kwild version $VERSION" ]; then
            echo "::error::kwild --version prints '$got', but the release is '$VERSION'"
            exit 1
          fi
          echo "kwild reports $VERSION"

      - name: Package Linux AMD64
        run: |
          tar -czvf ./.build/tn_${{ env.VERSION }}_linux_amd64.tar.gz -C ./.build kwild
          rm -rf ./.build/kwild

      - name: Build for Linux ARM64
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS" -o ./.build/kwild ./cmd/kwild/main.go
          tar -czvf ./.build/tn_${{ env.VERSION }}_linux_arm64.tar.gz -C ./.build kwild
          rm -rf ./.build/kwild

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./.build/tn_${{ env.VERSION }}_darwin_amd64.tar.gz
            ./.build/tn_${{ env.VERSION }}_darwin_arm64.tar.gz
            ./.build/tn_${{ env.VERSION }}_linux_amd64.tar.gz
            ./.build/tn_${{ env.VERSION }}_linux_arm64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
