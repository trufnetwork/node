services:
  kwil-gateway:
    container_name: kwil-gateway
    hostname: kwil-gateway
    build:
      context: .
      dockerfile: gateway.dockerfile
    ports:
      - "80:8090"
    environment:
      CHAIN_ID: ${CHAIN_ID:?}
      # default to 3 minutes
      READ_TIMEOUT: ${READ_TIMEOUT:-180}
      # comma separated list of backends
      BACKENDS: ${BACKENDS:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      DOMAIN: https://${DOMAIN:?}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      XFF_TRUST_PROXY_COUNT: ${XFF_TRUST_PROXY_COUNT:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-None}
      ALLOW_ADHOC_QUERY: ${ALLOW_ADHOC_QUERY:-true}
      # comma separated; replaces the default list in kgw-config.pkl
      AUTHN_EXEMPT_ACTIONS: ${AUTHN_EXEMPT_ACTIONS:-}
      EXTRA_ARGS: "--allow-chain-rpcs"
    volumes:
      - type: bind
        # bind the file to the container
        source: ${KGW_BINARY_PATH:-./kgw}
        target: /app/kgw
      - type: bind
        source: ./kgw-config.pkl
        target: /app/kgw-config.pkl
    logging:
      driver: "json-file"
      # keep at least a day: a busy gateway writes about 200 MB an hour, and
      # compressed rotated files take about 5 MB each, so 72 files hold
      # about 30 hours in about 0.5 GB of disk
      options:
        max-size: "100m"
        max-file: "72"
        compress: "true"
        tag: "{{.Name}}"