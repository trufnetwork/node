services:
  kwil-postgres:
    image: "ghcr.io/trufnetwork/kwil-postgres:16.8-2"
    hostname: kwil-postgres
    shm_size: 2G
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1.5G
    # persis data
    volumes:
      - ${POSTGRES_VOLUME:-data-kwil-postgres}:/var/lib/postgresql/data
    networks:
      - tn-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "2"
        tag: "{{.Name}}"

  # Sets up the Postgres roles kwild and tn_vacuum connect as. It runs before
  # kwild on every start and is safe to run again. A new database takes TCP
  # connections only once the image has set it up, so it waits for that first.
  tn-db-roles:
    image: "ghcr.io/trufnetwork/node:${TN_IMAGE:-local}"
    build:
      context: .
      dockerfile: ./deployments/Dockerfile
    entrypoint: [ "sh", "-c", "for i in $$(seq 60); do pg_isready --host=kwil-postgres --username=postgres --quiet && break; sleep 1; done; exec psql --host=kwil-postgres --username=postgres --no-psqlrc --set=ON_ERROR_STOP=1 --file=/app/postgres-roles.sql" ]
    restart: "no"
    depends_on:
      kwil-postgres:
        condition: service_healthy
    networks:
      - tn-network

  tn-db:
    container_name: tn-db
    hostname: tn-db
    image: "ghcr.io/trufnetwork/node:${TN_IMAGE:-local}"
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./deployments/Dockerfile
    environment:
      CONFIG_PATH: /root/.kwild
      # app.pg-db-host
      KWILD_DB_HOST: kwil-postgres
      # Optionally supply SETUP_DB_OWNER to override the owner derived from the generated node key
      SETUP_DB_OWNER: ${SETUP_DB_OWNER:-}
      SETUP_CHAIN_ID: ${SETUP_CHAIN_ID:-trufnetwork-dev}
      # Go memory tuning to prevent OOM kills within container memory limits.
      # GOMEMLIMIT should be ~80% of the container memory limit.
      GOMEMLIMIT: ${GOMEMLIMIT:-2500MiB}
      # GOGC=50 triggers GC when heap grows 50% (default 100), reducing peak memory.
      GOGC: ${GOGC:-50}
    ports:
      - "50051:50051"
      - "${TN_RPC_PORT:-8484}:8484"
      - "8080:8080"
      - "26656:26656"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8484/api/v1/health" ]
      interval: 1m
      timeout: 10s
      retries: 10
      start_period: 5m
    deploy:
      resources:
        limits:
          memory: 3G
    depends_on:
      kwil-postgres:
        condition: service_healthy
      tn-db-roles:
        condition: service_completed_successfully
    volumes:
      - ${TN_VOLUME:-data-tn-db}:/root/.kwild
    networks:
      - tn-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "2"
        tag: "{{.Name}}"

networks:
  tn-network:
    driver: bridge
    name: tn-network

volumes:
  data-kwil-postgres:
  data-tn-db:
